<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>다이빙 여행 비교 — 팔라우·시밀란·몰디브</title>
  <!-- ?v=2 는 "2번째 버전"이라는 표시일 뿐이다.
       주소가 달라지면 브라우저가 저장해둔 예전 CSS를 버리고 새로 읽는다.
       앞으로 style.css 를 고칠 때마다 이 숫자를 하나씩 올리면 된다. -->
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

  <!-- 상단 고정 영역: 안내 문구 + 가격대 토글 (스크롤해도 사라지지 않는다) -->
  <header class="topbar">
    <div class="topbar__inner">
      <h1 class="site-title">팔라우 · 시밀란 · 몰디브 비교</h1>
      <p class="notice">
        <strong>1인 기준</strong> · <strong>예시 데이터</strong> —
        이 금액은 실제 견적이 아니라 화면 확인용 예시 숫자입니다. 실제 비용은 현지 다이빙샵·항공사 확인이 필요합니다.
      </p>

      <div class="tier-group" id="tierGroup" role="group" aria-label="가격대 선택">
        <button type="button" class="tier-button" data-tier="low" aria-pressed="false">저가</button>
        <button type="button" class="tier-button" data-tier="mid" aria-pressed="false">중가</button>
        <button type="button" class="tier-button" data-tier="high" aria-pressed="false">고가</button>
      </div>
    </div>
  </header>

  <main class="page">
    <!-- 가격대가 선택되지 않은 예외 상황에만 보이는 안내 -->
    <p class="warn-box is-hidden" id="tierWarning"></p>

    <!-- 세 스팟 카드 3개 — 같은 크기로 나란히 놓은 것이 곧 비교 요약이다 -->
    <ul class="spot-grid" id="spotGrid"></ul>
  </main>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
