<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>일정별 금액 — 다이빙 여행 비교</title>
  <!-- index.html 과 같은 이유로 버전 표시를 붙인다. 두 파일의 숫자를 항상 같이 올린다. -->
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body>

  <!-- 상단 고정 영역: 메인과 같은 안내 문구를 스크롤 없이 보이게 둔다.
       가격대는 메인에서 고른 것을 그대로 쓰므로 여기에는 토글이 없다. -->
  <header class="topbar">
    <div class="topbar__inner">
      <h1 class="site-title" id="headerTitle">일정별 예상 금액</h1>
      <p class="notice">
        <strong>1인 기준</strong> · <strong>예시 데이터</strong> —
        이 금액은 실제 견적이 아니라 화면 확인용 예시 숫자입니다. 실제 비용은 현지 다이빙샵·항공사 확인이 필요합니다.
      </p>
    </div>
  </header>

  <main class="page">
    <!-- 뒤로가기 -->
    <a class="back-link" id="backLink" href="index.html">← 뒤로가기</a>

    <!-- 가격대가 선택되지 않은 예외 상황에만 보이는 안내 -->
    <p class="warn-box is-hidden" id="tierWarning"></p>

    <h2 class="detail-title" id="detailTitle"></h2>

    <h3 class="section-title">일정별 예상 금액</h3>
    <table class="price-table">
      <tbody id="priceRows"></tbody>
    </table>

    <h3 class="section-title">주요 다이빙 포인트</h3>
    <ul class="point-grid" id="pointGrid"></ul>
    <p class="source-note">포인트 정보 출처: liveaboard.com</p>

    <h3 class="section-title">다이빙 후 자유일정</h3>
    <ul class="free-grid" id="freeGrid"></ul>
  </main>

  <script src="data.js"></script>
  <script src="detail.js"></script>
</body>
</html>
